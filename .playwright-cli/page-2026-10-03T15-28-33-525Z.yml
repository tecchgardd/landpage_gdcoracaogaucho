    - generic [ref=e38]:
      - generic [ref=e39]:
        - paragraph [ref=e40]: Nossa trajetória
        - heading "Nossa História" [level=2] [ref=e41]
        - generic [ref=e42]:
          - paragraph [ref=e43]: Fundado em 2012, o Grupo de Dança Coração Gaúcho nasceu da paixão pela cultura e tradição do Rio Grande do Sul. Ao longo de mais de 13 anos, construímos uma trajetória marcada pelo compromisso em ensinar, preservar e transmitir os valores da tradição gaúcha por meio da dança.
          - paragraph [ref=e44]: Cada ensaio, apresentação e evento representa muito mais do que uma coreografia. É a oportunidade de manter viva uma cultura que atravessa gerações, unindo técnica, emoção e identidade em cada passo.
          - paragraph [ref=e45]: Ao longo dessa caminhada, tivemos a honra de participar de festivais, eventos culturais, apresentações comunitárias e formar centenas de alunos, sempre levando conosco o orgulho de representar a tradição gaúcha.
          - paragraph [ref=e46]: Nossa missão é formar pessoas apaixonadas pela cultura do nosso estado, preservando suas raízes e inspirando novas gerações a manter viva essa história.
      - img "Identidade institucional do Grupo de Danças Coração Gaúcho" [ref=e49]
    - generic [ref=e50]:
      - img "Professor Alan de Abreu e Eliane, responsáveis pelo GD Coração Gaúcho" [ref=e53]
      - generic [ref=e54]:
        - paragraph [ref=e55]: Alan e Eliane
        - heading "Quem está por trás dessa história" [level=2] [ref=e56]
        - generic [ref=e57]:
          - paragraph [ref=e58]: À frente do Grupo de Dança Coração Gaúcho estão o Professor Alan de Abreu e sua esposa Eliane, que dedicam suas vidas ao ensino da dança tradicional gaúcha.
          - paragraph [ref=e59]: Com carinho, dedicação e muita experiência, Alan conduz cada turma respeitando o tempo de aprendizado de cada aluno, enquanto Eliane transforma cada encontro em um ambiente acolhedor, leve e familiar.
          - paragraph [ref=e60]: Essa parceria vai muito além da dança. Ela representa um compromisso verdadeiro com a cultura, a formação de novas amizades e a preservação das tradições gaúchas.
          - paragraph [ref=e61]: Mais do que professores, eles se tornaram referência para centenas de alunos que encontraram no grupo um espaço para aprender, crescer e criar memórias inesquecíveis.
