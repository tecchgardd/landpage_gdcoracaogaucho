        - generic [ref=e248]:
          - paragraph [ref=e249]: O curso possui duração de 10 aulas, realizadas uma vez por semana, em horário e local definidos para cada turma. O conteúdo foi planejado para proporcionar aprendizado progressivo, convivência saudável e experiências marcantes no universo da cultura gaúcha.
          - paragraph [ref=e250]: Os professores acompanham o desenvolvimento de cada participante com atenção, paciência e dedicação, esclarecendo dúvidas e respeitando o ritmo individual de aprendizado.
