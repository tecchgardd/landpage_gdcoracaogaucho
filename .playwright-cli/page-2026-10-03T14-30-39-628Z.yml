        - paragraph [ref=f4e63]: Uma experiência para aprender, se divertir e viver a tradição gaúcha.
        - paragraph [ref=f4e64]: O Curso de Dança do Grupo Coração Gaúcho é a oportunidade ideal para quem deseja aprender a dançar com alegria, tradição e qualidade. O curso é acessível, acolhedor e foi desenvolvido para receber tanto quem nunca dançou quanto quem já possui experiência.
