openapi: 3.0.3
info:
  title: Coração Gaúcho — Backend API (contrato consumido pelo frontend)
  version: "1.0.0"
  description: >
    Esta especificação documenta o contrato de API **consumido** por este projeto
    (coracao-gaucho-next). O backend real vive em um repositório separado
    (NEXT_PUBLIC_API_URL, hoje `https://backend-coracaogaucho.vercel.app`) e não
    faz parte deste código-fonte — por isso esta spec foi reconstruída a partir
    das chamadas feitas em `services/public/*` e `services/account/*`, e não
    gerada a partir do código do backend. Trate-a como documentação de
    integração: se o backend mudar um contrato, esta spec deve ser atualizada
    manualmente.

    O navegador só chama a própria origem do site (`/api/...`). No servidor do Next:
    `/api/public/**` passa por um cache de leitura (60s, invalidável via
    `POST /api/revalidate`) e as demais rotas por um BFF com lista fechada
    (`src/app/api/[...path]/route.ts`) — rotas do backend fora desta spec não são
    acessíveis pelo site. O BFF repassa cookies nos dois sentidos, o header
    `Idempotency-Key` e `X-Forwarded-For` (IP real do cliente, para rate limit).
    Requisitos completos para o backend: `docs/CONTRATO_BACKEND.md`.
  contact:
    name: GD Coração Gaúcho
servers:
  - url: /
    description: Origem do site (servidor do Next faz cache/BFF para o backend)

tags:
  - name: Público — Catálogo
    description: Endpoints sem autenticação consumidos pelas páginas públicas (home, bilheteria, blog, curso).
  - name: Autenticação
    description: Sessão e cadastro de clientes (better-auth style, cookies first-party).
  - name: Conta do cliente
    description: Perfil, pedidos, ingressos e inscrições do usuário autenticado.
  - name: Pagamentos
    description: Checkout, status e retentativa de pagamento (Stripe por trás do backend).
  - name: Carrinho
    description: Carrinho no servidor (visitante via cookie httpOnly cg_cart; mesclado ao entrar na conta).
  - name: Privacidade (LGPD)
    description: Registro de consentimento de cookies.
  - name: Site (Next.js)
    description: Rotas implementadas no próprio frontend, chamadas pelo backend.

paths:
  /api/public/events:
    get:
      tags: [Público — Catálogo]
      summary: Lista eventos, bailes e cursos públicos
      description: >
        Usado por `ticketService.listAvailableEvents`, `publicEventService.list`
        (filtra `type !== 'CURSO'` no cliente) e `publicClassService.listAvailable`
        (usa `type=CURSO`).
      parameters:
        - name: upcoming
          in: query
          schema: { type: boolean }
          example: false
        - name: limit
          in: query
          schema: { type: integer }
          example: 100
        - name: type
          in: query
          description: Filtra por tipo no backend (ex. CURSO). Quando omitido, o frontend filtra localmente.
          schema: { type: string, enum: [BAILE, EVENTO, CURSO, APRESENTAÇÃO] }
      responses:
        "200":
          description: Lista de eventos (array puro ou envelope com data/items/results)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/PublicEventApi" }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/PublicEventApi" } }
                      items: { type: array, items: { $ref: "#/components/schemas/PublicEventApi" } }
                      results: { type: array, items: { $ref: "#/components/schemas/PublicEventApi" } }

  /api/public/events/{idOrSlug}:
    get:
      tags: [Público — Catálogo]
      summary: Detalhe de um evento, baile ou curso por id ou slug
      description: Usado por `ticketService.getEvent`, `publicEventService.getBySlug` e `publicClassService.getBySlug`.
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evento encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEventApi" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/albums:
    get:
      tags: [Público — Catálogo]
      summary: Lista álbuns de formatura/eventos
      responses:
        "200":
          description: Lista de álbuns
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/PublicAlbumApi" }
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/PublicAlbumApi" } }

  /api/public/albums/{slug}:
    get:
      tags: [Público — Catálogo]
      summary: Detalhe de um álbum (com fotos embutidas, quando disponíveis)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Álbum encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAlbumApi" }

  /api/public/albums/{slug}/photos:
    get:
      tags: [Público — Catálogo]
      summary: Fotos paginadas de um álbum (cursor-based)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 40 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Página de fotos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PublicAlbumImage" } }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }

  /api/public/empresas:
    get:
      tags: [Público — Catálogo]
      summary: Lista de empresas apoiadoras exibidas na home
      responses:
        "200":
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PublicEmpresa" } }

  /api/auth/get-session:
    get:
      tags: [Autenticação]
      summary: Retorna a sessão atual (cookie first-party)
      responses:
        "200":
          description: Sessão atual, ou null se deslogado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }

  /api/auth/sign-in/email:
    post:
      tags: [Autenticação]
      summary: Login com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/customer-auth/sign-up:
    post:
      tags: [Autenticação]
      summary: Cadastro de novo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, cpf, phone, cep, address, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                cpf: { type: string, description: "Somente dígitos (11 caracteres)" }
                phone: { type: string, description: "Somente dígitos, com DDD (10-11 caracteres)" }
                cep: { type: string, description: "Somente dígitos (8 caracteres)" }
                address: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Conta criada e sessão iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }

  /api/auth/sign-out:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão atual
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Logout efetuado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/auth/sign-in/social:
    post:
      tags: [Autenticação]
      summary: Inicia login social (Apple, Facebook, Google ou Microsoft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, callbackURL]
              properties:
                provider: { type: string, enum: [apple, facebook, google, microsoft], example: google }
                callbackURL: { type: string, format: uri }
      responses:
        "200":
          description: URL de redirecionamento para o provedor OAuth
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  redirect: { type: boolean }

  /api/me/profile:
    get:
      tags: [Conta do cliente]
      summary: Dados de perfil do cliente autenticado
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Perfil (pode estar parcialmente preenchido)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Conta do cliente]
      summary: Atualiza dados pessoais e endereço do cliente
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                cpf: { type: string }
                phone: { type: string }
                birthDate: { type: string, format: date }
                gender: { type: string, enum: [MASCULINO, FEMININO, OUTRO, NAO_INFORMADO] }
                cep: { type: string }
                address: { type: string }
                number: { type: string }
                complement: { type: string }
                neighborhood: { type: string }
                state: { type: string }
                city: { type: string }
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "422":
          description: Dados obrigatórios ausentes ou inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }

  /api/me/checkout/validate:
    post:
      tags: [Pagamentos]
      summary: Revalida itens do carrinho (preço, disponibilidade, quantidade) antes de pagar
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemsBody" }
      responses:
        "200":
          description: Resultado da validação, com itens válidos/inválidos e totais oficiais
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartValidation" }

  /api/payments/checkout:
    post:
      tags: [Pagamentos]
      summary: Cria o pedido e inicia o checkout (Stripe) ou confirma direto se gratuito
      description: >
        Rota canônica de checkout. O frontend envia apenas `items` e `origin`;
        preço e disponibilidade são sempre recalculados no backend (ver teste
        `tests/payment-contract.test.mjs`).
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CartItemsBody"
                - type: object
                  properties:
                    origin: { type: string, enum: [SITE] }
      responses:
        "200":
          description: Pedido criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/CheckoutResult" }
        "409":
          description: Pedido já pago ou com tentativa ativa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "422":
          description: Perfil do cliente incompleto — frontend redireciona para /minha-conta/perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/payments/{orderId}/status:
    get:
      tags: [Pagamentos]
      summary: Consulta o status de pagamento de um pedido (usado em polling)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Status atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/PaymentStatus" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/payments/{orderId}/retry:
    post:
      tags: [Pagamentos]
      summary: Abre uma nova sessão de pagamento para um pedido pendente/falho
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Nova sessão de checkout
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/CheckoutResult" }

  /api/me/orders:
    get:
      tags: [Conta do cliente]
      summary: Lista os pedidos do cliente autenticado
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CustomerOrder" } }

  /api/me/orders/{id}:
    get:
      tags: [Conta do cliente]
      summary: Detalhe de um pedido (deve pertencer ao cliente autenticado)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrder" }
        "404":
          description: Pedido não encontrado ou não pertence a esta conta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorBody" }

  /api/me/tickets:
    get:
      tags: [Conta do cliente]
      summary: Ingressos pagos do cliente (com QR code)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Lista de ingressos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /api/me/enrollments:
    get:
      tags: [Conta do cliente]
      summary: Inscrições do cliente em cursos/turmas
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Lista de inscrições
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  # ---------------------------------------------------------------------------
  # PLANEJADO — ainda não existe no backend. O frontend já consome estas rotas e,
  # com NEXT_PUBLIC_USE_MOCKS=true, simula tudo em localStorage. Ver docs/ARQUITETURA.md.
  # ---------------------------------------------------------------------------
  /api/public/products:
    get:
      tags: [Loja (planejado)]
      summary: Lista produtos ativos da loja (camisetas, bonés, pilcha...)
      responses:
        "200":
          description: Lista (array ou { data })
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } }
  /api/public/products/{slug}:
    get:
      tags: [Loja (planejado)]
      summary: Detalhe do produto por slug ou id
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Produto, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        "404": { description: Não encontrado }
  /api/public/courses:
    get:
      tags: [Cursos online (planejado)]
      summary: Lista cursos online à venda (com grade de módulos/aulas, sem URLs de vídeo)
      responses:
        "200":
          description: Lista
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OnlineCourse' } } } }
  /api/public/courses/{slug}:
    get:
      tags: [Cursos online (planejado)]
      summary: Página de venda do curso
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Curso, content: { application/json: { schema: { $ref: '#/components/schemas/OnlineCourse' } } } }
  /api/me/courses:
    get:
      tags: [Área do aluno (planejado)]
      summary: Acessos (matrículas) do cliente logado, com progresso
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Lista de CourseAccess, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CourseAccess' } } } } }
  /api/me/courses/redeem:
    post:
      tags: [Área do aluno (planejado)]
      summary: Vincula um código de acesso (presente/venda no balcão) à conta
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, example: VAN3RA24 } } } } } }
      responses:
        "200": { description: Acesso criado, content: { application/json: { schema: { $ref: '#/components/schemas/CourseAccess' } } } }
        "404": { description: Código inválido ou já usado }
  /api/me/courses/{slug}:
    get:
      tags: [Área do aluno (planejado)]
      summary: Sala de aula — acesso + módulos/aulas com flag completed
      security: [{ cookieAuth: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ access: CourseAccess, modules: [{ id, title, lessons: [{ id, title, durationMinutes, completed, description, materials }] }] }" }
        "404": { description: Sem acesso a este curso }
  /api/me/courses/{courseId}/sessions:
    post:
      tags: [Área do aluno (planejado)]
      summary: Reserva uma vaga de aparelho para assistir (limite de sessões simultâneas por conta)
      description: >
        Sessão ativa = heartbeat nos últimos 2 min. Se já houver `maxDevices` sessões ativas
        de OUTROS aparelhos, responde 409 com code DEVICE_LIMIT e details.devices.
        O aparelho é identificado pelo cookie httpOnly `cg_device` (UUID, 1 ano), que o
        backend cria aqui se não existir — o frontend não guarda nem envia ID de aparelho.
        O mesmo aparelho reaproveita a própria vaga.
      security: [{ cookieAuth: [] }]
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [deviceName], properties: { deviceName: { type: string, example: Chrome no Android } } } } } }
      responses:
        "200": { description: "{ sessionId, heartbeatSeconds }" }
        "409": { description: "{ code: DEVICE_LIMIT, message, details: { devices: CustomerDevice[] } }" }
  /api/me/course-sessions/{sessionId}/heartbeat:
    post:
      tags: [Área do aluno (planejado)]
      summary: Mantém a sessão viva (a cada 60s). 409 SESSION_REVOKED se foi encerrada em outro aparelho
      security: [{ cookieAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "409": { description: Sessão revogada } }
  /api/me/course-sessions/{sessionId}:
    delete:
      tags: [Área do aluno (planejado)]
      summary: Libera a vaga ao sair da aula
      security: [{ cookieAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
  /api/me/course-sessions/{sessionId}/end:
    post:
      tags: [Área do aluno (planejado)]
      summary: Igual ao DELETE, para navigator.sendBeacon ao fechar a aba
      security: [{ cookieAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
  /api/me/lessons/{lessonId}/playback:
    get:
      tags: [Área do aluno (planejado)]
      summary: URL assinada e de curta duração do vídeo — exige sessionId ativo
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string } }
        - { name: sessionId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ url, kind: mp4 | hls | embed, expiresAt }" }
        "409": { description: Sessão inválida/revogada }
  /api/me/lessons/{lessonId}/progress:
    post:
      tags: [Área do aluno (planejado)]
      summary: Salva progresso (a cada ~15s e ao concluir)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { seconds: { type: integer }, completed: { type: boolean } } } } } }
      responses: { "200": { description: OK } }
  /api/me/devices:
    get:
      tags: [Área do aluno (planejado)]
      summary: Aparelhos que já acessaram as aulas
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: "CustomerDevice[] = [{ id, name, lastSeenAt, current, watching }] — current é calculado pelo backend comparando com o cookie cg_device" }
  /api/me/devices/{deviceId}:
    delete:
      tags: [Área do aluno (planejado)]
      summary: Desconecta um aparelho (revoga as sessões dele)
      security: [{ cookieAuth: [] }]
      parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /api/cart:
    get:
      tags: [Carrinho]
      summary: Carrinho atual (da conta, se logado; senão do visitante pelo cookie cg_cart)
      description: >
        Se não houver cookie cg_cart nem sessão, responde carrinho vazio e cria o cookie
        (httpOnly, Secure, SameSite=Lax, 30 dias). Ao entrar na conta, o backend mescla o
        carrinho do visitante no da conta (somando quantidades, respeitando limites) e apaga o do visitante.
      responses:
        "200": { description: Carrinho, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
    delete:
      tags: [Carrinho]
      summary: Esvazia o carrinho
      responses:
        "200": { description: Carrinho vazio, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
  /api/cart/items:
    post:
      tags: [Carrinho]
      summary: Adiciona ou substitui uma linha (upsert pela chave; quantity substitui, não soma)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutLine" }
      responses:
        "200": { description: Carrinho atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
        "409": { description: Item esgotado/indisponível, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorBody" } } } }
        "422": { description: "Quantidade inválida (1–20; cursos e turmas = 1)" }
  /api/cart/items/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string, example: "PRODUCT:p1:p1-M" }, description: "EVENT:<id> | PRODUCT:<id>:<variantId|u> | COURSE:<id>" }]
    patch:
      tags: [Carrinho]
      summary: Altera a quantidade
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 20 } } } } } }
      responses:
        "200": { description: Carrinho atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }
    delete:
      tags: [Carrinho]
      summary: Remove a linha
      responses:
        "200": { description: Carrinho atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }

  /api/consents:
    post:
      tags: [Privacidade (LGPD)]
      summary: Registra a escolha de cookies (prova de consentimento)
      description: >
        Guardar com data/hora, versão, IP (X-Forwarded-For), user-agent e userId se houver sessão.
        Chamada "fire-and-forget" — falha não bloqueia o site.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version, preferences, media], properties: { version: { type: integer, example: 1 }, preferences: { type: boolean }, media: { type: boolean } } } } } }
      responses: { "201": { description: Registrado } }

  /api/revalidate:
    post:
      tags: [Site (Next.js)]
      summary: Invalida o cache de leitura do catálogo — chamado PELO BACKEND após escrita
      description: >
        Implementado no frontend (src/app/api/revalidate/route.ts). O backend chama após criar/editar
        evento, lote, produto, estoque, curso, álbum ou empresa (de preferência via outbox/fila).
      parameters: [{ name: x-revalidate-secret, in: header, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { tags: { type: array, items: { type: string, enum: [catalog, "catalog:events", "catalog:products", "catalog:courses", "catalog:albums", "catalog:empresas"] } } } } } } }
      responses:
        "200": { description: "{ revalidated: string[], at }" }
        "401": { description: Segredo inválido }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: >
        UUID gerado pelo frontend por tentativa de compra. O backend guarda (chave + userId) -> resposta
        por 24h; repetição com o mesmo corpo devolve a MESMA resposta sem criar outro pedido; corpo
        diferente com a mesma chave -> 422; requisição ainda em andamento com a mesma chave -> 409.

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cg-admin.session_token
      description: >
        Sessão first-party via cookie httpOnly (em produção `__Secure-cg-admin.session_token`),
        propagada porque o navegador chama `/api/...` na mesma origem e o BFF do Next repassa
        Cookie/Set-Cookie ao backend.

  responses:
    TooManyRequests:
      description: Limite de requisições atingido — enviar header Retry-After (segundos)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
    Unauthorized:
      description: Sessão expirada ou ausente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorBody" }

  schemas:
    Product:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        images: { type: array, items: { type: string } }
        price: { type: number, description: Reais (o checkout recalcula) }
        compareAtPrice: { type: number }
        available: { type: integer, nullable: true }
        soldOut: { type: boolean }
        variants: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string, example: M }, available: { type: integer, nullable: true }, price: { type: number } } } }
    OnlineCourse:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        image: { type: string }
        trailerUrl: { type: string }
        level: { type: string }
        price: { type: number }
        compareAtPrice: { type: number }
        lessonsCount: { type: integer }
        durationMinutes: { type: integer }
        accessDays: { type: integer, nullable: true, description: null = vitalício }
        maxDevices: { type: integer, default: 2 }
        teachers: { type: array, items: { type: string } }
        highlights: { type: array, items: { type: string } }
        modules: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, lessons: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, durationMinutes: { type: integer }, preview: { type: boolean } } } } } } }
    CourseAccess:
      type: object
      description: Matrícula/token de acesso vinculado ao cliente, gerado quando o pagamento é confirmado
      properties:
        id: { type: string }
        code: { type: string, example: VAN3RA24 }
        status: { type: string, enum: [ATIVO, EXPIRADO, REVOGADO] }
        course: { $ref: '#/components/schemas/OnlineCourse' }
        progressPercent: { type: integer }
        lastLessonId: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    ApiErrorBody:
      type: object
      description: >
        Formato de erro tratado por `services/public/apiClient.ts`. Para os
        status 401/404/409/422/429/503 o frontend substitui a mensagem por um
        texto amigável fixo, independentemente do que o backend retornar.
      properties:
        message: { type: string }
        error: { type: string }
        details: {}

    PublicEventApi:
      type: object
      description: Payload bruto do backend — todos os campos são opcionais e passam por `mapEventFromApi` (aceita variantes PT/EN de nome de campo).
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        type: { type: string, enum: [BAILE, EVENTO, CURSO, APRESENTAÇÃO] }
        description: { type: string }
        banner: { type: string }
        date: { type: string, format: date-time }
        time: { type: string }
        place: { type: string }
        city: { type: string }
        startingPrice: { type: number }
        status: { type: string, example: ATIVO }
        available: { type: integer, nullable: true }
        soldOut: { type: boolean }
        free: { type: boolean }
        capacity: { type: integer, nullable: true }
        salesEndAt: { type: string, format: date-time }

    PublicAlbumApi:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        city: { type: string }
        date: { type: string }
        coverImage: { type: string }
        photoCount: { type: integer }
        status: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/PublicAlbumImage" }

    PublicAlbumImage:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        thumbnailUrl: { type: string }
        alt: { type: string }
        width: { type: integer }
        height: { type: integer }

    PublicEmpresa:
      type: object
      required: [id, nome, imagemUrl]
      properties:
        id: { type: string }
        nome: { type: string }
        imagemUrl: { type: string }

    SessionUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        image: { type: string, nullable: true }

    SessionResponse:
      type: object
      nullable: true
      properties:
        user: { $ref: "#/components/schemas/SessionUser" }
        session: {}

    Profile:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        cpf: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [MASCULINO, FEMININO, OUTRO, NAO_INFORMADO] }
        cep: { type: string }
        address: { type: string }
        number: { type: string }
        complement: { type: string }
        neighborhood: { type: string }
        state: { type: string }
        city: { type: string }
        complete: { type: boolean, description: "True quando todos os campos obrigatórios estão preenchidos" }

    CheckoutLine:
      oneOf:
        - type: object
          required: [eventId, quantity]
          properties:
            eventId: { type: integer }
            quantity: { type: integer, minimum: 1, maximum: 20 }
        - type: object
          required: [productId, quantity]
          properties:
            productId: { type: string }
            variantId: { type: string }
            quantity: { type: integer, minimum: 1, maximum: 20 }
        - type: object
          required: [courseId, quantity]
          properties:
            courseId: { type: string }
            quantity: { type: integer, enum: [1] }

    CartItemsBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: >
            Só identificadores e quantidades — nunca preço. O backend pode ignorar esta lista e
            usar o carrinho do servidor (GET /api/cart), mas deve aceitá-la para compatibilidade.
          items: { $ref: "#/components/schemas/CheckoutLine" }

    CartLine:
      type: object
      required: [key, kind, refId, quantity, title]
      properties:
        key: { type: string, example: "EVENT:12" }
        kind: { type: string, enum: [EVENT, PRODUCT, COURSE] }
        refId: { type: string }
        variantId: { type: string }
        variantLabel: { type: string, example: M }
        quantity: { type: integer }
        title: { type: string }
        type: { type: string, description: "BAILE | CURSO | PRODUTO | CURSO ONLINE ..." }
        image: { type: string, format: uri }
        unitPrice: { type: number, description: "Prévia do preço atual (o valor final é recalculado no checkout)" }
        date: { type: string, format: date-time }
        city: { type: string }
        place: { type: string }
        href: { type: string, example: /loja/eventos/baile-farroupilha }
        available: { type: integer, nullable: true }

    Cart:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
        updatedAt: { type: string, format: date-time }

    ValidatedItem:
      type: object
      properties:
        key: { type: string, description: "Opcional (planejado): EVENT:<id> | PRODUCT:<id>:<variantId> | COURSE:<id>" }
        eventId: { type: integer }
        productId: { type: string }
        variantId: { type: string }
        courseId: { type: string }
        itemType: { type: string, enum: [EVENT, DANCE, COURSE, PRODUCT, ONLINE_COURSE] }
        name: { type: string }
        type: { type: string }
        banner: { type: string }
        startsAt: { type: string, format: date-time }
        city: { type: string }
        venue: { type: string }
        requestedQuantity: { type: integer }
        quantity: { type: integer }
        quantityAdjusted: { type: boolean }
        unitPrice: { type: number }
        total: { type: number }
        available: { type: integer, nullable: true }
        free: { type: boolean }

    CartValidation:
      type: object
      properties:
        validItems:
          type: array
          items: { $ref: "#/components/schemas/ValidatedItem" }
        invalidItems:
          type: array
          items:
            type: object
            properties:
              eventId: { type: integer }
              name: { type: string }
              reason: { type: string }
        subtotal: { type: number }
        fee: { type: number }
        total: { type: number }
        changed: { type: boolean, description: "True quando preço/quantidade oficiais diferem do que o carrinho local tinha" }

    CheckoutResult:
      type: object
      properties:
        orderId: { type: integer }
        paymentId: { type: integer, nullable: true }
        checkoutSessionId: { type: string, nullable: true }
        checkoutUrl: { type: string, nullable: true, description: "URL da Stripe Checkout Session; null quando o pedido é gratuito e já foi confirmado" }
        status: { type: string, example: PAGO }

    PaymentStatus:
      type: object
      properties:
        orderId: { type: integer }
        orderStatus: { type: string }
        paymentStatus:
          type: string
          enum: [PENDENTE, PROCESSANDO, PAGO, FALHOU, CANCELADO, EXPIRADO, ESTORNADO, PARCIALMENTE_ESTORNADO, CONTESTADO, CONTESTACAO_PERDIDA]
        checkoutStatus: { type: string, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        paymentId: { type: integer, nullable: true }

    CustomerOrder:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        code: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        paymentMethod: { type: string }
        total: { type: number }
        createdAt: { type: string, format: date-time }
        statusLabel: { type: string }
        items:
          type: array
          items: { type: object, additionalProperties: true }
